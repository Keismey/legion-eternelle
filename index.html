<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Légion Éternelle</title>
<meta name="theme-color" content="#0b0b10">
<meta name="description" content="Idle RPG de Keismey Studio : farmez, équipez votre légion et repoussez le mur.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<style>:root{color-scheme:dark}body{background:#0b0b10;color:#ece9f2}</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="splash" id="splash">
  <button class="splash-title" id="splashTitle">
    <span class="title-top">
      <span class="title-name" data-i18n="app.title">Légion Éternelle</span>
      <span class="title-sub">Idle RPG</span>
    </span>
    <span class="splash-tap" id="splashTap">Appuyez pour commencer</span>
  </button>
  <div class="splash-logo" id="splashLogo">
    <img src="assets/keismey-logo.webp" alt="Keismey Studio" width="520" height="483">
  </div>
</div>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <img src="assets/icon-192.png" alt="" class="brand-icon" width="28" height="28">
      <span class="brand-name" data-i18n="app.title">Légion Éternelle</span>
    </div>
    <div class="wallet">
      <span class="coin" id="goldChip" title="Or"><img class="currency-img" src="assets/icons/gold.webp" alt="" draggable="false"><span id="gold" class="num">0</span></span>
      <span class="coin" id="soulsChip" hidden><img class="currency-img" src="assets/icons/souls.webp" alt="" draggable="false"><span id="souls" class="num">0</span></span>
      <button class="icon-btn" id="settingsBtn" aria-label="Réglages">
        <span class="dot" id="settingsDot" hidden></span>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.4-2.5.1-1-.1-1 2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.7c-.6.2-1.2.6-1.7 1l-2.5-1-2 3.4L4.6 11l-.1 1 .1 1-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.7c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.4-2.1-1.6Z"/></svg>
      </button>
    </div>
  </header>

  <section class="zone" id="zone">
    <div class="zone-main">
      <div class="zone-level">
        <span class="zone-kicker" id="zoneMode">Progression</span>
        <span class="zone-number" id="zoneLevel">Niveau 1</span>
      </div>
      <div class="zone-side">
        <span class="zone-power"><span data-i18n="zone.power">Puissance</span> <b id="teamPower" class="num">0</b></span>
        <span class="zone-best" id="zoneBest">Record 1</span>
      </div>
    </div>
    <div class="waves" id="waves" aria-label="Vagues"></div>
    <div class="zone-actions" id="zoneActions"></div>
  </section>

  <main class="tabs">
    <section class="tab" id="tab-combat" data-tab="combat">
      <div class="battlefield" id="battlefield">
        <div class="boss-bar" id="bossBar" hidden>
          <span class="boss-name" id="bossName"></span>
          <span class="boss-skill" id="bossSkill"></span>
          <span class="boss-timer num" id="bossTimer"></span>
        </div>
        <div class="units monsters" id="monsters"></div>
        <div class="battle-status" id="battleStatus"></div>
        <div class="units heroes" id="heroes"></div>
      </div>
      <div class="ult-row" id="ultRow"></div>
      <section class="quests" id="quests"></section>
      <ol class="feed" id="feed" aria-live="polite"></ol>
    </section>

    <section class="tab" id="tab-team" data-tab="team" hidden></section>
    <section class="tab" id="tab-bag" data-tab="bag" hidden></section>
    <section class="tab" id="tab-awaken" data-tab="awaken" hidden></section>
    <section class="tab" id="tab-challenges" data-tab="challenges" hidden></section>
  </main>

  <nav class="navbar" id="navbar">
    <button data-nav="team"><span class="nav-ico" aria-hidden="true">🛡️</span><span data-i18n="nav.team">Équipe</span></button>
    <button data-nav="bag"><span class="nav-ico" aria-hidden="true">🎒</span><span data-i18n="nav.bag">Sac</span><span class="badge" id="bagBadge" hidden></span></button>
    <button data-nav="combat" class="active nav-main"><span class="nav-ico" aria-hidden="true">⚔️</span><span data-i18n="nav.combat">Combat</span></button>
    <button data-nav="challenges"><span class="nav-ico" aria-hidden="true">🏆</span><span data-i18n="nav.challenges">Défis</span><span class="dot" id="challengeDot" hidden></span></button>
    <button data-nav="awaken"><span class="nav-ico" aria-hidden="true">✴️</span><span data-i18n="nav.awaken">Éveil</span><span class="dot" id="awakenDot" hidden></span></button>
  </nav>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheetBody"></div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="peek" id="peek" hidden></div>
  <div class="reveal" id="reveal" hidden>
    <div class="reveal-card" id="revealBody" role="dialog" aria-modal="true"></div>
  </div>
  <div class="tuto" id="tuto" hidden>
    <div class="tuto-ring" id="tutoRing" hidden></div>
    <div class="tuto-card" id="tutoCard" role="dialog" aria-modal="true" aria-live="polite"></div>
  </div>
</div>

<audio id="music" src="assets/music.mp3" loop preload="none"></audio>
<script type="module" src="js/main.js"></script>
</body>
</html>
